<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carpath-weborganizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .admin-scroll::-webkit-scrollbar { width: 6px; }
        .admin-scroll::-webkit-scrollbar-track { background: transparent; }
        .admin-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .link-button { transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .link-button:hover { transform: scale(1.03); }
        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; object-fit: cover; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script>
        tailwind.config = {
            safelist: [
                'grid-cols-1', 'grid-cols-2', 'grid-cols-3', 
                'grid-cols-4', 'grid-cols-5', 'grid-cols-6',
                'sm:grid-cols-2', 'md:grid-cols-2', 'md:grid-cols-3', 
                'lg:grid-cols-1', 'lg:grid-cols-2', 'lg:grid-cols-3', 
                'lg:grid-cols-4', 'lg:grid-cols-5', 'lg:grid-cols-6'
            ]
        }

        // Failsafe Ultime : Garantit que l'écran de chargement disparaît même en cas d'erreur fatale de navigateur ou de CDN bloqué
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('app-loader');
                const mainUI = document.getElementById('main-ui');
                if (loader && loader.style.display !== 'none') {
                    console.warn("Failsafe activé : chargement forcé.");
                    loader.style.display = 'none';
                    if (mainUI) mainUI.style.display = 'flex';
                }
            }, 3000);
        });
    </script>
</head>
<body x-data="linktreeApp()" class="min-h-screen relative transition-colors duration-300" :style="bodyStyle()">

    <!-- Arrière-plans dynamiques -->
    <template x-if="settings.bgType === 'image' && settings.bgImage">
        <img :src="settings.bgImage" class="bg-layer" alt="Background">
    </template>
    <template x-if="settings.bgType === 'video' && settings.bgVideo">
        <video :src="settings.bgVideo" autoplay loop muted playsinline class="bg-layer"></video>
    </template>
    <!-- Overlay sombre léger si fond image ou vidéo pour la lisibilité -->
    <template x-if="settings.bgType !== 'color'">
        <div class="fixed inset-0 bg-black/40 z-[-1]"></div>
    </template>

    <!-- Bouton flottant pour ouvrir l'admin -->
    <button @click="editMode = !editMode" 
            class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white p-4 rounded-full shadow-2xl hover:bg-slate-800 transition-transform hover:scale-110 flex items-center gap-2 group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-300 ease-in-out whitespace-nowrap font-bold" x-text="editMode ? 'Fermer' : 'Éditer la page'"></span>
    </button>

    <!-- Écran de chargement (Vanilla JS) -->
    <div id="app-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900 text-white transition-opacity duration-300">
        <svg class="animate-spin h-10 w-10 text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-sm font-semibold animate-pulse tracking-wide">Chargement de votre portail...</p>
    </div>

    <!-- Conteneur principal -->
    <div id="main-ui" class="flex h-screen w-full overflow-hidden flex-row" style="display: none;">
        
        <!-- Panneau d'administration (Gauche) -->
        <div x-show="editMode" 
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="-translate-x-full"
             x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="translate-x-0"
             x-transition:leave-end="-translate-x-full"
             class="w-full md:w-[450px] bg-white text-slate-800 shadow-2xl z-40 h-full flex flex-col absolute md:relative border-r border-slate-200 left-0">
             
            <!-- VUE CONNEXION -->
            <template x-if="!session">
                <div class="flex flex-col h-full items-center justify-center p-6 bg-slate-50">
                    <div class="w-full max-w-sm bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div class="text-center mb-6">
                            <h2 class="text-xl font-bold text-slate-900">Espace Éditeur</h2>
                            <p class="text-sm text-slate-500 mt-1">Gérez le portail <span x-text="portalSlug" class="font-bold"></span></p>
                        </div>
                        <div class="space-y-4">
                            <input type="email" id="authEmail" name="email" autocomplete="username" x-model="authEmail" placeholder="Email" class="w-full p-3 border border-slate-300 rounded focus:border-blue-500 outline-none">
                            <input type="password" id="authPassword" name="password" autocomplete="current-password" x-model="authPassword" @keyup.enter="login()" placeholder="Mot de passe" class="w-full p-3 border border-slate-300 rounded focus:border-blue-500 outline-none">
                            <button @click="login()" class="w-full py-3 bg-[#1e3a8a] text-white font-bold rounded hover:bg-blue-800 transition-colors" :disabled="authLoading">
                                <span x-text="authLoading ? 'Connexion en cours...' : 'Se connecter'"></span>
                            </button>
                            <div x-show="authError" class="text-red-500 text-sm text-center mt-2 font-medium" x-text="authError"></div>
                        </div>
                    </div>
                </div>
            </template>
            
            <!-- VUE 1 : MENU PRINCIPAL (Catégories) -->
            <template x-if="session && adminView === 'main'">
                <div class="flex flex-col h-full">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
                        <h2 class="text-xl font-bold text-slate-900">Paramètres</h2>
                        <div class="flex gap-2">
                            <button @click="resetDefaults" class="text-xs text-red-600 font-semibold hover:bg-red-50 px-2 py-1 rounded">Réinitialiser</button>
                            <button @click="logout" class="text-xs text-slate-600 font-semibold hover:bg-slate-200 px-2 py-1 rounded">Déconnexion</button>
                        </div>
                    </div>

                    <div class="p-6 overflow-y-auto admin-scroll flex-1 space-y-8">
                        
                        <!-- Section Arrière-plan & Couleurs -->
                        <section class="space-y-4">
                            <div class="flex items-center justify-between border-b pb-2">
                                <h3 class="font-bold text-slate-400 uppercase text-xs tracking-wider">1. Design & Fond</h3>
                                <button @click="mediaLibraryOpen = !mediaLibraryOpen" class="text-xs text-[#1e3a8a] font-bold hover:underline flex items-center gap-1">
                                    <i class="ph-bold ph-images"></i> Librairie Médias
                                </button>
                            </div>

                            <!-- LIBRAIRIE MEDIAS -->
                            <div x-show="mediaLibraryOpen" x-collapse>
                                <div class="bg-slate-50 border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                    <div class="flex border-b border-slate-200 overflow-x-auto admin-scroll">
                                        <button @click="mediaLibraryTab = 'colors'" class="flex-1 px-3 py-2 text-xs font-bold whitespace-nowrap" :class="mediaLibraryTab === 'colors' ? 'bg-white text-[#1e3a8a] border-b-2 border-[#1e3a8a]' : 'text-slate-500 hover:bg-slate-100'">Couleurs</button>
                                        <button @click="mediaLibraryTab = 'images'" class="flex-1 px-3 py-2 text-xs font-bold whitespace-nowrap" :class="mediaLibraryTab === 'images' ? 'bg-white text-[#1e3a8a] border-b-2 border-[#1e3a8a]' : 'text-slate-500 hover:bg-slate-100'">Images</button>
                                        <button @click="mediaLibraryTab = 'videos'" class="flex-1 px-3 py-2 text-xs font-bold whitespace-nowrap" :class="mediaLibraryTab === 'videos' ? 'bg-white text-[#1e3a8a] border-b-2 border-[#1e3a8a]' : 'text-slate-500 hover:bg-slate-100'">Vidéos</button>
                                        <button @click="mediaLibraryTab = 'audios'" class="flex-1 px-3 py-2 text-xs font-bold whitespace-nowrap" :class="mediaLibraryTab === 'audios' ? 'bg-white text-[#1e3a8a] border-b-2 border-[#1e3a8a]' : 'text-slate-500 hover:bg-slate-100'">Musiques</button>
                                    </div>
                                    <div class="p-4 max-h-60 overflow-y-auto admin-scroll">
                                        <!-- Colors -->
                                        <div x-show="mediaLibraryTab === 'colors'" class="grid grid-cols-5 gap-3">
                                            <template x-for="c in presetColors">
                                                <button @click="settings.bgType = 'color'; settings.bgColor = c; saveState()" class="w-full aspect-square rounded-full shadow-sm hover:scale-110 transition-transform border border-black/10" :style="`background-color: ${c}`"></button>
                                            </template>
                                        </div>
                                        <!-- Images -->
                                        <div x-show="mediaLibraryTab === 'images'" class="grid grid-cols-2 gap-2">
                                            <template x-for="img in presetImages">
                                                <button @click="settings.bgType = 'image'; settings.bgImage = img; saveState()" class="w-full aspect-video rounded shadow-sm overflow-hidden hover:ring-2 hover:ring-blue-500 transition-all bg-slate-200">
                                                    <img :src="img" class="w-full h-full object-cover">
                                                </button>
                                            </template>
                                        </div>
                                        <!-- Videos -->
                                        <div x-show="mediaLibraryTab === 'videos'" class="grid grid-cols-2 gap-2">
                                            <template x-for="vid in presetVideos">
                                                <button @click="settings.bgType = 'video'; settings.bgVideo = vid; saveState()" class="w-full aspect-video rounded shadow-sm overflow-hidden hover:ring-2 hover:ring-blue-500 transition-all bg-black relative flex items-center justify-center group">
                                                    <video :src="vid" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition-opacity" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>
                                                    <i class="ph-fill ph-play-circle text-white text-2xl absolute drop-shadow-md"></i>
                                                </button>
                                            </template>
                                        </div>
                                        <!-- Audios -->
                                        <div x-show="mediaLibraryTab === 'audios'" class="flex flex-col gap-2">
                                            <template x-for="audio in presetAudios">
                                                <button @click="settings.bgAudioUrl = audio.url; saveState()" class="w-full text-left p-2 text-xs font-semibold rounded hover:bg-blue-50 hover:text-blue-600 transition-colors flex items-center gap-2 border border-slate-100 bg-white">
                                                    <i class="ph-bold ph-music-notes text-lg"></i> <span x-text="audio.name"></span>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-600">Type d'arrière-plan</label>
                                <select x-model="settings.bgType" @change="saveState" class="w-full text-sm p-2 border rounded outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="color">Couleur unie</option>
                                    <option value="image">Image</option>
                                    <option value="video">Vidéo</option>
                                </select>
                            </div>

                            <div x-show="settings.bgType === 'color'" class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold mb-1 text-slate-600">Fond de la page</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" x-model="settings.bgColor" @input="saveState" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                                        <input type="text" x-model="settings.bgColor" @input="saveState" class="w-full text-xs p-1.5 border rounded">
                                    </div>
                                </div>
                            </div>

                            <div x-show="settings.bgType === 'image'" class="space-y-2">
                                <label class="block text-xs font-semibold mb-1 text-slate-600">Image de fond</label>
                                <div x-data="{ isDragging: false }" 
                                     @dragover.prevent="isDragging = true" 
                                     @dragleave.prevent="isDragging = false" 
                                     @drop.prevent="isDragging = false; processFileUpload($event.dataTransfer.files[0], res => settings.bgImage = res)"
                                     class="relative border-2 border-dashed rounded p-3 text-center cursor-pointer transition-colors"
                                     :class="isDragging ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'">
                                    <input type="file" accept="image/*" @change="handleBgImageUpload" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="">
                                    <span class="text-xs text-slate-500 font-semibold flex items-center justify-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                        <span x-text="isDragging ? 'Relâchez pour ajouter' : 'Glisser-déposer ou cliquer'"></span>
                                    </span>
                                </div>
                                <div class="text-[10px] text-center text-slate-400 font-bold uppercase my-1">ou</div>
                                <div class="flex gap-2">
                                    <input type="text" x-model="settings.bgImage" @input="saveState" placeholder="Lien de l'image (https://...)" class="flex-1 text-sm p-2 border rounded">
                                    <button @click="handleBgPaste" type="button" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-xs font-semibold flex items-center gap-1 transition-colors">
                                        📋 Coller
                                    </button>
                                </div>
                            </div>

                            <div x-show="settings.bgType === 'video'" class="space-y-2">
                                <label class="block text-xs font-semibold mb-1 text-slate-600">Vidéo de fond (URL recommandée)</label>
                                <input type="text" x-model="settings.bgVideo" @input="saveState" placeholder="Lien de la vidéo MP4 (https://...)" class="w-full text-sm p-2 border rounded mb-2">
                                <div class="text-[10px] text-center text-slate-400 font-bold uppercase">ou (fichiers légers < 10Mo)</div>
                                <div x-data="{ isDragging: false }" 
                                     @dragover.prevent="isDragging = true" 
                                     @dragleave.prevent="isDragging = false" 
                                     @drop.prevent="isDragging = false; processFileUpload($event.dataTransfer.files[0], res => settings.bgVideo = res)"
                                     class="relative border-2 border-dashed rounded p-3 text-center cursor-pointer transition-colors"
                                     :class="isDragging ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'">
                                    <input type="file" accept="video/mp4,video/webm" @change="handleBgVideoUpload" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="">
                                    <span class="text-xs text-slate-500 font-semibold flex items-center justify-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                        <span x-text="isDragging ? 'Relâchez pour ajouter' : 'Glisser-déposer ou cliquer'"></span>
                                    </span>
                                </div>
                            </div>

                            <div class="mt-4 pt-4 border-t border-slate-100 space-y-2">
                                <label class="block text-xs font-semibold mb-1 text-slate-600">Musique de fond (Optionnelle)</label>
                                <div x-data="{ isDragging: false }" 
                                     @dragover.prevent="isDragging = true" 
                                     @dragleave.prevent="isDragging = false" 
                                     @drop.prevent="isDragging = false; processFileUpload($event.dataTransfer.files[0], res => settings.bgAudioUrl = res)"
                                     class="relative border-2 border-dashed rounded p-3 text-center cursor-pointer transition-colors"
                                     :class="isDragging ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'">
                                    <input type="file" accept="audio/*" @change="e => { processFileUpload(e.target.files[0], res => settings.bgAudioUrl = res); e.target.value=''; }" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="">
                                    <span class="text-xs text-slate-500 font-semibold flex items-center justify-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                                        <span x-text="isDragging ? 'Relâchez pour ajouter' : 'Glisser-déposer un fichier MP3'"></span>
                                    </span>
                                </div>
                                <div class="flex items-center justify-between mt-2" x-show="settings.bgAudioUrl">
                                    <div class="text-[10px] text-slate-500 truncate flex-1" x-text="settings.bgAudioUrl"></div>
                                    <button @click="settings.bgAudioUrl = ''; saveState()" class="text-xs text-red-500 hover:text-red-700 font-semibold ml-2">Supprimer</button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4 pt-2">
                                <div>
                                    <label class="block text-xs font-semibold mb-1 text-slate-600">Texte principal</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" x-model="settings.textColor" @input="saveState" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold mb-1 text-slate-600">Fond des boutons/cartes</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" x-model="settings.buttonBgColor" @input="saveState" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold mb-1 text-slate-600">Texte boutons/cartes</label>
                                    <div class="flex items-center gap-2">
                                        <input type="color" x-model="settings.buttonTextColor" @input="saveState" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4 pt-4 border-t border-slate-100">
                                <label class="block text-xs font-semibold mb-2 text-slate-600">Disposition des Catégories (Niveau 1)</label>
                                <div class="flex items-center gap-3">
                                    <input type="range" min="1" max="6" x-model="settings.categoriesColumns" @input="saveState" class="flex-1 accent-[#1e3a8a]">
                                    <span class="text-sm font-bold w-12 text-center bg-slate-100 py-1 rounded" x-text="(settings.categoriesColumns || 1) + ' col'"></span>
                                </div>
                            </div>
                        </section>

                        <!-- Section Profil -->
                        <section class="space-y-4">
                            <h3 class="font-bold text-slate-400 uppercase text-xs tracking-wider border-b pb-2">2. Profil</h3>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-600">Logo / Photo</label>
                                <div class="space-y-2">
                                    <div x-data="{ isDragging: false }" 
                                         @dragover.prevent="isDragging = true" 
                                         @dragleave.prevent="isDragging = false" 
                                         @drop.prevent="isDragging = false; processFileUpload($event.dataTransfer.files[0], res => settings.logoUrl = res)"
                                         class="relative border-2 border-dashed rounded p-3 text-center cursor-pointer transition-colors"
                                         :class="isDragging ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'">
                                        <input type="file" accept="image/*" @change="handleLogoUpload" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="">
                                        <span class="text-xs text-slate-500 font-semibold flex items-center justify-center gap-2">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                            <span x-text="isDragging ? 'Relâchez pour ajouter' : 'Glisser-déposer ou cliquer'"></span>
                                        </span>
                                    </div>
                                    <div class="flex gap-2">
                                        <input type="text" x-model="settings.logoUrl" @input="saveState" placeholder="Lien (https://...)" class="flex-1 text-sm p-2 border rounded">
                                        <button @click="handleLogoPaste" type="button" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-xs font-semibold flex items-center gap-1 transition-colors">
                                            📋 Coller
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-600">Titre</label>
                                <input type="text" x-model="settings.title" @input="saveState" class="w-full text-sm p-2 border rounded font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-600">Description</label>
                                <textarea x-model="settings.description" @input="saveState" rows="3" class="w-full text-sm p-2 border rounded resize-none"></textarea>
                            </div>

        const iconsList = [
            'folder', 'folder-open', 'file-text', 'file-pdf', 'archive', 'clipboard-text',
            'megaphone', 'target', 'trend-up', 'chart-bar', 'chart-line', 'chart-pie-slice', 'envelope-simple', 'share-network', 'lightbulb', 'projector-screen', 'presentation-chart',
            'currency-eur', 'money', 'wallet', 'shopping-cart', 'tag', 'credit-card', 'receipt', 'bank', 'piggy-bank', 'handshake', 'storefront',
            'users', 'user-circle', 'user-focus', 'briefcase', 'calendar', 'calendar-check', 'clock', 'building-office', 'id-badge',
            'headset', 'chat-circle-text', 'wrench', 'gear', 'lifebuoy', 'question', 'info',
            'device-mobile', 'desktop', 'laptop', 'globe', 'map-pin', 'navigation-arrow', 'qr-code', 'link',
            'star', 'heart', 'thumbs-up', 'check-circle', 'sparkle', 'video-camera', 'camera'
        ];

        document.addEventListener('alpine:init', () => {
            Alpine.data('linktreeApp', () => ({
                editMode: false,
                adminView: 'main', // 'main' | 'category' | 'subcategory'
                editingCategoryId: null,
                editingSubcategoryId: null,
                
                currentCategoryId: null,
                currentSubcategoryId: null,

                settings: JSON.parse(JSON.stringify(defaultState.settings)),
                categories: JSON.parse(JSON.stringify(defaultState.categories)),
                presetIcons: iconsList,
                audioPlaying: false,
                
                searchQuery: '',
                sidebarOpen: window.innerWidth >= 1024,

                presetColors: ['#1e3a8a', '#0f172a', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#3b82f6', '#14b8a6', '#f43f5e', '#64748b', '#ffffff', '#000000'],
                presetImages: [
                    'https://images.unsplash.com/photo-1506744626753-1fa28f6e3c03?q=80&w=1920',
                    'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=1920',
                    'https://images.unsplash.com/photo-1497215728101-856f4ea42174?q=80&w=1920',
                    'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1920',
                    'https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=1920',
                    'https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1920'
                ],
                presetVideos: [
                    'https://cdn.pixabay.com/video/2016/08/22/4762-179738669_large.mp4',
                    'https://cdn.pixabay.com/video/2018/06/17/16769-275143362_large.mp4',
                    'https://cdn.pixabay.com/video/2019/11/04/28731-371452934_large.mp4',
                    'https://cdn.pixabay.com/video/2015/09/21/722-139745585_large.mp4'
                ],
                presetAudios: [
                    { name: 'LoFi Chill', url: 'https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3' },
                    { name: 'Corporate Tech', url: 'https://cdn.pixabay.com/audio/2022/10/25/audio_27606e10db.mp3' },
                    { name: 'Ambient Piano', url: 'https://cdn.pixabay.com/audio/2022/01/18/audio_d0a13f69d2.mp3' },
                    { name: 'Acoustic Guitar', url: 'https://cdn.pixabay.com/audio/2021/08/25/audio_981a8c983a.mp3' }
                ],
                mediaLibraryOpen: false,
                mediaLibraryTab: 'colors',

                supabase: null,
                session: null,
                portalSlug: '',
                authEmail: '',
                authPassword: '',
                authError: '',
                authLoading: false,
                authLoading: false,

                async init() {
                    try {
                        this.supabase = supabase.createClient('https://rugwfkovnisyrjtvjzjb.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1Z3dma292bmlzeXJqdHZqempiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDc0MDMsImV4cCI6MjEwNDAyMzQwM30.AMGbJDy-HERt3lVRsitKVNf--C3Z3acRz_gvYmp7iSk');
                        
                        const params = new URLSearchParams(window.location.search);
                        this.portalSlug = params.get('p') || 'default';

                        const { data, error } = await this.supabase.auth.getSession();
                        if (data) this.session = data.session;

                        this.supabase.auth.onAuthStateChange((_event, currentSession) => {
                            this.session = currentSession;
                        });

                        await this.loadState();
                        if(this.categories.length === 0) this.editMode = true;
                    } catch (e) {
                        console.error("Erreur critique lors de l'initialisation :", e);
                    } finally {
                        const loader = document.getElementById('app-loader');
                        const mainUI = document.getElementById('main-ui');
                        if (loader) loader.style.display = 'none';
                        if (mainUI) mainUI.style.display = 'flex';
                    }
                },

                async login() {
                    this.authLoading = true;
                    this.authError = '';
                    
                    // Fallback DOM direct au cas où LastPass n'a pas déclenché d'événement Alpine
                    const emailVal = this.authEmail || document.getElementById('authEmail').value;
                    const passVal = this.authPassword || document.getElementById('authPassword').value;

                    const { error } = await this.supabase.auth.signInWithPassword({
                        email: emailVal.trim().toLowerCase(),
                        password: passVal.trim(),
                    });
                    if (error) {
                        console.error("Erreur Auth:", error);
                        // Afficher l'erreur exacte renvoyée par Supabase (traduite si classique)
                        if (error.message.includes('Email not confirmed')) {
                            this.authError = 'Email non confirmé (Désactivez "Confirm Email" dans Supabase).';
                        } else if (error.message.includes('Invalid login credentials')) {
                            this.authError = 'Email ou mot de passe incorrect.';
                        } else {
                            this.authError = error.message;
                        }
                    }
                    this.authLoading = false;
                },

                async logout() {
                    await this.supabase.auth.signOut();
                    this.editMode = false;
                },

                toggleAudio() {
                    const audioEl = this.$refs.bgAudioPlayer;
                    if (!audioEl) return;
                    if (this.audioPlaying) {
                        audioEl.pause();
                        this.audioPlaying = false;
                    } else {
                        audioEl.play().then(() => {
                            this.audioPlaying = true;
                        }).catch(e => {
                            console.error("Lecture audio bloquée", e);
                            this.audioPlaying = false;
                        });
                    }
                },

                // --- Getters Admin ---
                get activeCategory() {
                    return this.categories.find(c => c.id === this.editingCategoryId);
                },
                get activeSubcategory() {
                    return this.activeCategory?.subcategories.find(s => s.id === this.editingSubcategoryId);
                },

                // --- Getters Public ---
                get currentCategory() {
                    return this.categories.find(c => c.id === this.currentCategoryId);
                },
                get currentSubcategory() {
                    return this.currentCategory?.subcategories.find(s => s.id === this.currentSubcategoryId);
                },
                get searchResults() {
                    if (!this.searchQuery) return [];
                    const q = this.searchQuery.toLowerCase().trim();
                    let results = [];
                    for (const cat of this.categories) {
                        for (const sub of cat.subcategories) {
                            for (const card of sub.cards) {
                                if ((card.title && card.title.toLowerCase().includes(q)) || 
                                    (card.url && card.url.toLowerCase().includes(q))) {
                                    results.push(card);
                                }
                            }
                        }
                    }
                    return results;
                },

                bodyStyle() {
                    if(this.settings.bgType === 'color') {
                        return `background-color: ${this.settings.bgColor}; color: ${this.settings.textColor}`;
                    }
                    return `color: ${this.settings.textColor}`;
                },

                formatDescription(text) {
                    if(!text) return '';
                    return text.replace(/\n/g, '<br>');
                },

                getIconClass(id) {
                    const map = {
                        'document': 'file-text',
                        'chart': 'chart-line',
                        'video': 'video-camera',
                        'mail': 'envelope-simple',
                        'shopping-bag': 'shopping-cart'
                    };
                    const safeId = id || 'folder';
                    return `ph ph-${map[safeId] || safeId} text-xl`;
                },

                // --- Navigation Public ---
                openCategory(id) {
                    this.currentCategoryId = id;
                    this.currentSubcategoryId = null;
                },
                closeCategory() {
                    this.currentCategoryId = null;
                    this.currentSubcategoryId = null;
                },
                openSubcategory(id) {
                    this.currentSubcategoryId = id;
                },
                closeSubcategory() {
                    this.currentSubcategoryId = null;
                },

                // --- Navigation Admin ---
                editCategory(id) {
                    this.editingCategoryId = id;
                    this.adminView = 'category';
                },
                editSubcategory(id) {
                    this.editingSubcategoryId = id;
                    this.adminView = 'subcategory';
                },
                backToAdminMain() {
                    this.editingCategoryId = null;
                    this.editingSubcategoryId = null;
                    this.adminView = 'main';
                    this.saveState();
                },
                backToAdminCategory() {
                    this.editingSubcategoryId = null;
                    this.adminView = 'category';
                    this.saveState();
                },

                // --- Uploads ---
                processFileUpload(file, callback) {
                    if (file) {
                        if (file.size > 10 * 1024 * 1024) { 
                            alert("Le fichier est trop lourd (limite ~10Mo). Préférez utiliser une URL (lien) pour les gros fichiers.");
                            return;
                        }
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            callback(e.target.result);
                            this.saveState();
                        };
                        reader.readAsDataURL(file);
                    }
                },
                
                async pasteImageFromClipboard(callback) {
                    try {
                        const clipboardItems = await navigator.clipboard.read();
                        for (const clipboardItem of clipboardItems) {
                            for (const type of clipboardItem.types) {
                                if (type.startsWith('image/')) {
                                    const blob = await clipboardItem.getType(type);
                                    const file = new File([blob], "pasted-image.png", { type: blob.type });
                                    this.processFileUpload(file, callback);
                                    return;
                                }
                            }
                        }
                        alert("Aucune image trouvée dans le presse-papiers.");
                    } catch (err) {
                        console.error(err);
                        alert("Impossible de lire le presse-papiers. Vérifiez les autorisations de votre navigateur.");
                    }
                },

                handleLogoUpload(event) { this.processFileUpload(event.target.files[0], (res) => this.settings.logoUrl = res); },
                handleLogoPaste() { this.pasteImageFromClipboard((res) => this.settings.logoUrl = res); },
                
                handleBgImageUpload(event) { this.processFileUpload(event.target.files[0], (res) => this.settings.bgImage = res); },
                handleBgPaste() { this.pasteImageFromClipboard((res) => this.settings.bgImage = res); },
                
                handleBgVideoUpload(event) { this.processFileUpload(event.target.files[0], (res) => this.settings.bgVideo = res); },
                
                handleCardImageUpload(event, card) { this.processFileUpload(event.target.files[0], (res) => card.image = res); },
                handleCardImagePaste(card) { this.pasteImageFromClipboard((res) => card.image = res); },

                // --- Gestion des Données ---
                generateId() {
                    return Date.now() + Math.floor(Math.random() * 1000);
                },
                addCategory() {
                    this.categories.push({
                        id: this.generateId(),
                        title: 'Nouvelle Catégorie',
                        subcategories: []
                    });
                    this.saveState();
                    setTimeout(() => {
                        const list = this.$refs.categoriesList;
                        if(list) list.parentElement.scrollTop = list.parentElement.scrollHeight;
                    }, 50);
                },
                removeCategory(index) {
                    if(confirm("Supprimer cette catégorie et tout son contenu ?")) {
                        this.categories.splice(index, 1);
                        this.saveState();
                    }
                },
                addSubcategory() {
                    if(!this.activeCategory) return;
                    this.activeCategory.subcategories.push({
                        id: this.generateId(),
                        title: 'Nouvelle Sous-catégorie',
                        columns: 2,
                        cards: []
                    });
                    this.saveState();
                    setTimeout(() => {
                        const list = this.$refs.subcategoriesList;
                        if(list) list.parentElement.scrollTop = list.parentElement.scrollHeight;
                    }, 50);
                },
                removeSubcategory(index) {
                    if(!this.activeCategory) return;
                    if(confirm("Supprimer cette sous-catégorie et toutes ses cartes ?")) {
                        this.activeCategory.subcategories.splice(index, 1);
                        this.saveState();
                    }
                },
                addCard() {
                    if(!this.activeSubcategory) return;
                    this.activeSubcategory.cards.push({
                        id: this.generateId(),
                        title: 'Nouvelle carte',
                        image: '',
                        url: 'https://'
                    });
                    this.saveState();
                },
                removeCard(index) {
                    if(!this.activeSubcategory) return;
                    if(confirm("Supprimer cette carte ?")) {
                        this.activeSubcategory.cards.splice(index, 1);
                        this.saveState();
                    }
                },
                moveCard(card, currentIndex, targetSubId) {
                    if (!targetSubId || targetSubId == this.activeSubcategory.id) return;
                    
                    let targetCat = null;
                    let targetSub = null;
                    
                    for (const c of this.categories) {
                        const s = c.subcategories.find(sub => sub.id == targetSubId);
                        if (s) {
                            targetCat = c;
                            targetSub = s;
                            break;
                        }
                    }
                    
                    if (targetSub) {
                        this.activeSubcategory.cards.splice(currentIndex, 1);
                        targetSub.cards.push(card);
                        this.categories = [...this.categories]; // Force Alpine reactivity
                        this.saveState();
                    }
                },
                reorderItems(type, oldIndex, newIndex) {
                    let list = null;
                    if (type === 'categories') list = this.categories;
                    else if (type === 'subcategories') list = this.activeCategory?.subcategories;
                    else if (type === 'cards') list = this.activeSubcategory?.cards;
                    else if (type === 'cards_preview') list = this.currentSubcategory?.cards;
                    
                    if (list && oldIndex !== newIndex) {
                        const item = list.splice(oldIndex, 1)[0];
                        list.splice(newIndex, 0, item);
                        this.saveState();
                    }
                },

                async saveState() {
                    const state = {
                        settings: this.settings,
                        categories: this.categories
                    };
                    
                    // Toujours sauvegarder en local en backup
                    localStorage.setItem('mssLinktreeState', JSON.stringify(state));
                    
                    // Sauvegarde dans Supabase si connecté
                    if (this.session) {
                        const { error } = await this.supabase.from('portals').upsert(
                            { slug: this.portalSlug, state: state }, 
                            { onConflict: 'slug' }
                        );
                        if (error) console.error("Erreur de sauvegarde:", error);
                    }
                },

                migrateIcons(categories) {
                    if (!categories) return [];
                    categories.forEach(cat => {
                        if (cat.icon && !cat.iconType) { cat.iconType = 'preset'; cat.iconValue = cat.icon; delete cat.icon; }
                        if (!cat.iconType) cat.iconType = 'preset';
                        if (cat.subcategories) {
                            cat.subcategories.forEach(sub => {
                                if (sub.icon && !sub.iconType) { sub.iconType = 'preset'; sub.iconValue = sub.icon; delete sub.icon; }
                                else if (!sub.iconType) { sub.iconType = 'none'; }
                                
                                if (sub.cards) {
                                    sub.cards.forEach(card => {
                                        if (card.image && !card.iconType) {
                                            card.iconType = 'custom';
                                            card.iconValue = card.image;
                                            delete card.image;
                                        } else if (card.icon && !card.iconType) {
                                            card.iconType = 'preset';
                                            card.iconValue = card.icon;
                                            delete card.icon;
                                        } else if (!card.iconType) {
                                            card.iconType = 'preset';
                                            card.iconValue = 'link';
                                        }
                                    });
                                }
                            });
                        }
                    });
                    return categories;
                },

                async loadState() {
                    let loadedFromLocal = false;

                    // Si on est sur le portail par défaut, on priorise toujours les données locales s'il y en a (Backup utilisateur)
                    if (this.portalSlug === 'default') {
                        const saved = localStorage.getItem('mssLinktreeState');
                        if (saved) {
                            try {
                                const parsed = JSON.parse(saved);
                                if (parsed.settings) this.settings = { ...this.settings, ...parsed.settings };
                                if (parsed.categories) this.categories = this.migrateIcons(parsed.categories);
                                loadedFromLocal = true;
                                console.log("Données récupérées depuis le cache local !");
                            } catch (e) { console.error('Local Load error', e); }
                        }
                    }

                    // Charger depuis Supabase si on n'a pas chargé depuis le local
                    if (!loadedFromLocal) {
                        const { data, error } = await this.supabase.from('portals').select('state').eq('slug', this.portalSlug).single();
                        if (data && data.state) {
                            try {
                                const parsed = data.state;
                                this.settings = { ...this.settings, ...parsed.settings };
                                this.categories = this.migrateIcons(parsed.categories || []);
                            } catch (e) { console.error('Load error', e); }
                        }
                    }
                },

                resetDefaults() {
                    if(confirm("Attention : Cela effacera toutes vos catégories, sous-catégories, cartes et réglages. Continuer ?")) {
                        localStorage.removeItem('mssLinktreeState');
                        this.settings = JSON.parse(JSON.stringify(defaultState.settings));
                        this.categories = JSON.parse(JSON.stringify(defaultState.categories));
                        this.currentCategoryId = null;
                        this.currentSubcategoryId = null;
                        this.adminView = 'main';
                    }
                }
            }));
        });
    </script>
